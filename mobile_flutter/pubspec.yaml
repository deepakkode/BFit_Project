name: bfit
description: A thoughtful daily movement companion for BFit.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.4
  flutter_timezone: ^4.1.1
  http: ^1.2.2
  pedometer: ^4.0.2
  permission_handler: ^11.3.1
  sensors_plus: ^6.1.1
  shared_preferences: ^2.3.2
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/bfit-mark.png
